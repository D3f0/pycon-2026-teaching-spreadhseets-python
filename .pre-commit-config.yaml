default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uvx --with invoke-toolkit --with pyyaml ty check
        language: system
        files: ^tasks\.py$
        pass_filenames: true
        types: [python]
